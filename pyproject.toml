[project]
name = "tta"
version = "0.1.0"
description = "Tobit Trend Analysis workflow"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
tta = "tta.run:main"
prepare-chromium-chemistry = "tta.preprocessing.prepare_chromium_chemistry:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]